name: Evaluate and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controlled-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned runtime and build dependencies
        run: python -m pip install -r requirements-provenance.lock setuptools==75.8.2 wheel==0.45.1
      - name: Install package
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check environment
        run: python -m patchreplay doctor
      - name: Test evaluation, integrity, replay and claims
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Generate inspectable evidence
        if: always()
        run: python -m patchreplay demo --output demo-output
      - name: Check suite claim
        run: python -m patchreplay check demo-output/claim-suite-supported.json
      - name: Exercise offline provenance with ephemeral demo keys
        run: python scripts/provenance_demo.py --output provenance-output
      - name: Build distributable wheel
        run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - name: Install and smoke test wheel including compiled fixture data
        run: |
          python -c "import pathlib,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps','--force-reinstall',str(next(pathlib.Path('dist').glob('*.whl')))])"
          python -m patchreplay run good --output wheel-output
          python -m patchreplay_provenance verify --bundle provenance-output/bundle --trusted-key provenance-output/trust/demo-public.pem --expectation provenance-output/trust/observer.expected.json
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            demo-output/
            test-results.xml
            dist/
            wheel-output/
            provenance-output/
          retention-days: 14
